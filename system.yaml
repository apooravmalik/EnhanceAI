version: 1
name: local-retrieval-v1-1
workflows:
  ingest:
    input:
      path: path
    nodes:
      load:
        uses: documents.load
      chunk:
        uses: documents.chunk
        with:
          size: 180
          overlap: 30
      index:
        uses: retrieval.index
        with:
          name: default
          storage: sqlite
          dimensions: 128
    connections:
      - from: $input.path
        to: load.path
      - from: load.documents
        to: chunk.documents
      - from: chunk.chunks
        to: index.chunks
    output:
      index_id: index.index_id
      index_info: index.index_info

  answer:
    input:
      question: string
    nodes:
      lexical:
        uses: retrieval.bm25
        with:
          name: default
          top_k: 12
          k1: 1.2
          b: 0.75
      vector:
        uses: retrieval.hash
        with:
          name: default
          top_k: 12
      fuse:
        uses: retrieval.rrf
        with:
          top_k: 5
          rrf_k: 10
          primary_weight: 1.0
          secondary_weight: 1.0
      rerank:
        uses: retrieval.rerank
        with:
          top_k: 5
      answer:
        uses: answer.extractive
    connections:
      - from: $input.question
        to: lexical.question
      - from: $input.question
        to: vector.question
      - from: lexical.chunks
        to: fuse.primary
      - from: vector.chunks
        to: fuse.secondary
      - from: $input.question
        to: rerank.question
      - from: fuse.chunks
        to: rerank.chunks
      - from: $input.question
        to: answer.question
      - from: rerank.chunks
        to: answer.chunks
    output:
      answer: answer.answer
      sources: rerank.chunks
